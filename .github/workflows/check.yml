name: validation
on: [push, pull_request]
jobs:
  build-and-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:helper
      - run: npm run build
      - run: for script in scripts/*.sh tests/install-permissions.sh; do bash -n "$script"; done
      - run: sudo env "PATH=$PATH" bash tests/install-permissions.sh
      - run: python3 -m py_compile helper/*.py helper/github-askpass scripts/acceptance-runtime.py
