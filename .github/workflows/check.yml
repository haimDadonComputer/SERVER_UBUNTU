name: validation
on: [push, pull_request]
jobs:
  build-and-security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:helper
      - run: npm run build
      - run: bash -n scripts/install.sh
      - run: python3 -m py_compile helper/*.py
